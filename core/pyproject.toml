[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aegis-core"
version = "0.1.0"
description = "AEGIS core contracts, local artifact storage and protection orchestrator."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
