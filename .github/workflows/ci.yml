name: CI

# Clean-clone continuous integration for AEGIS (Role A / integration foundation).
#
# Core and native integration jobs, plus offline Lab validation:
#   python-suite  - the Core, API and CLI tests, installed exactly as a fresh
#                   clone would per README.md#setup. Fast, no native toolchain.
#   llvm-shield   - builds the LLVM Shield plugin and runs its CTest suite plus
#                   the real adapter integration tests against LLVM 22.
#
# This workflow does not fabricate results: a job that cannot install its
# prerequisites fails rather than reporting a skipped suite as passing.

on:
  push:
    branches: [dev/integration, "feat/**"]
  pull_request:
    branches: [dev/integration]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-suite:
    name: Python suite (core, api, cli, provenance, sentinel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install packages (clean-clone setup)
        run: sh scripts/setup-python.sh

      - name: Run default suite
        run: .venv/bin/python -m pytest

  llvm-shield:
    name: LLVM Shield plugin + adapter suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install LLVM 22, CMake and Ninja
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y cmake ninja-build llvm-22-dev clang-22
          echo "LLVM_DIR=$(llvm-config-22 --cmakedir)" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/dashboard/package-lock.json

      - name: Install Python packages (adapter drives core)
        run: sh scripts/setup-python.sh

      - name: Build Shield plugin
        run: |
          cmake -S protectors/llvm -B /tmp/aegis-shield-build -G Ninja \
            -DLLVM_DIR="$LLVM_DIR" \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/aegis-shield-build -j2

      - name: Shield CTest suite
        run: ctest --test-dir /tmp/aegis-shield-build --output-on-failure

      - name: Adapter integration suite
        run: |
          .venv/bin/python -m pytest protectors/llvm/adapter/tests -q \
            --shield-plugin /tmp/aegis-shield-build/AegisShield.so \
            --shield-opt "$(command -v opt-22)" \
            --shield-clang "$(command -v clang-22)"

      - name: Mirage and Shield+Mirage final-link retention, outputs and disabled controls
        run: |
          PYTHONPATH=protectors/mirage/src .venv/bin/python -m pytest scripts/native_tests -q \
            --shield-plugin /tmp/aegis-shield-build/AegisShield.so

      - name: Install locked dashboard and browser dependencies
        working-directory: platform/dashboard
        run: |
          npm ci
          npx --no-install playwright install chromium

      - name: Build local product and owned ImageLab
        run: |
          .venv/bin/python scripts/product.py build
          .venv/bin/python scripts/product.py configure
          ctest --test-dir /tmp/aegis-product/imagelab-build --output-on-failure

      - name: Real API and browser protection smoke
        working-directory: platform/dashboard
        run: npm run test:e2e

      - name: Browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-browser-diagnostics
          path: /tmp/aegis-product-browser-results
          if-no-files-found: ignore

  dashboard:
    name: Dashboard contracts + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: platform/dashboard/package-lock.json
      - name: Install, test and build
        working-directory: platform/dashboard
        run: |
          npm ci
          npm test
          npm run build

  product-scripts:
    name: Product script failure paths and evidence export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: sh scripts/setup-python.sh
      - name: Install Lab and Mirage for product-script integration
        run: |
          uv pip install --python .venv/bin/python -c core/requirements-dev.lock \
            -e './attack_lab[dev]' -e ./protectors/mirage
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: platform/dashboard/package-lock.json
      - name: Build dashboard assets for product packaging tests
        working-directory: platform/dashboard
        run: |
          npm ci
          npm run build
      - run: .venv/bin/python -m pytest scripts/tests -q

  lab-suite:
    name: Lab offline suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Lab
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -c core/requirements-dev.lock -e './attack_lab[dev]'
      - name: Run Lab offline tests
        run: .venv/bin/python -m pytest attack_lab/tests --lab-profile offline -q

  # Core+Lab strict integration is deliberately not enabled against unmerged Core.
  # Merge prerequisites and the exact future job are in docs/release/CI-INTEGRATION.md.
