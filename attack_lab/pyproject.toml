[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aegis-lab"
version = "0.1.0"
description = "Reproducible adversarial software-protection trial records for AEGIS."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Phase 4 requires Role A's matching execution-contract build. It is not
# required for offline analysis/reconstruction installations.
scoring = ["aegis-core>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
