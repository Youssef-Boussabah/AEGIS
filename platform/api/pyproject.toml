[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aegis-api"
version = "0.1.0"
description = "AEGIS HTTP API (FastAPI) over the local orchestrator."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "aegis-core==0.1.0",
    "aegis-provenance==0.1.0",
    "aegis-sentinel==0.1.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
aegis-api = "aegis_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
