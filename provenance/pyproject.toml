[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aegis-provenance"
version = "0.1.0"
description = "AEGIS offline signed provenance manifest, public-key verification, and watermark research."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "aegis-core",
    "aegis-sentinel",
    "pydantic>=2.7,<3",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aegis-provenance = "aegis_provenance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_provenance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

